# yaml-language-server: $schema=https://json.schemastore.org/pyproject.json
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "advent-of-code-sql"
version = "0.0.0"
description = "SQL solutions to the Advent of Code problem sets."
authors = [{name = "billwallis"}]
maintainers = [{name = "billwallis"}]
readme = "README.md"
urls.Homepage = "https://github.com/billwallis/advent-of-code-sql"
urls.Repository = "https://github.com/billwallis/advent-of-code-sql"
urls.Issues = "https://github.com/billwallis/advent-of-code-sql/issues"
urls.Documentation = "https://github.com/billwallis/advent-of-code-sql/blob/main/README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "arguably>=1.0.0",
    "duckdb>=1.4.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.2.2",
    "requests>=2.0.0",
]
scripts.aoc = "advent_of_code.__main__:arguably.run"

[dependency-groups]
dev = [
    "poethepoet>=0.48.0",
    "pre-commit>=4.6.2",
    "pyyaml>=6.0.0",
]
test = [
    "covdefaults>=2.3.0",
    "coverage>=7.16.0",
    "pytest>=9.1.1",
]


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.coverage]
run.source = ["src", "tests"]
run.plugins = ["covdefaults"]  # https://youtu.be/70T6OxKwxm0
report.fail_under = 80
report.exclude_lines = [
    "@pytest.mark.skip",
    "@pytest.mark.xfail",
]


[tool.poe]
verbosity = -1
envfile.optional = ".env"

[tool.poe.tasks]
install.shell = """
    pip install --editable . --group dev --group test --force-reinstall
    pre-commit install --install-hooks
"""
test.shell = """
    coverage erase
    coverage run -m pytest -vvv
    coverage xml --quiet
    coverage report --no-skip-covered --include 'tests/*' --fail-under 100
    coverage report --no-skip-covered --include 'src/*'
"""

[tool.poe.tasks.lint]
control.expr = "sys.platform"

[[tool.poe.tasks.lint.switch]]
case = "win32"
shell = """
    echo '=== pre-commit checks ==='
    SKIP=identity pre-commit run --all-files --hook-stage pre-commit
    echo '=== pre-push checks ==='
    SKIP=identity pre-commit run --all-files --hook-stage pre-push
"""

[[tool.poe.tasks.lint.switch]]
shell = """
    echo '\\033[0;34mpre-commit checks\\033[0m'
    SKIP=identity pre-commit run --all-files --hook-stage pre-commit
    echo '\\033[0;34mpre-push checks\\033[0m'
    SKIP=identity pre-commit run --all-files --hook-stage pre-push
"""
